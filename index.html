<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--Pyscript-->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <title>Nickname Atlas; Nordic Countries</title>
</head>
<body style="background-color: #C8102E;">
    <nav class="navbar navbar-expand-sm" style="background-color: #02529C; padding: 25px; margin-bottom: 75px;">
        <div class="nav-links">
            <a href="index.html" class="active" style="all: unset; color: #FFFFFF;  margin-left: 5px; margin-right: 20px;"><b>Nickname Atlas; Nordic Countries</b></a>
            <a href="more.html" style="all: unset;  color: #FFFFFF;"><b>More Information</b></a>
            <!-- Allows us to switch between the index.html and the more.html pages-->
        </div>
    </nav>

    <main id="whole" style="background-color: #002F6C; color: #FFFFFF; margin: 0 auto; padding: 40px; width: 40%; text-align: center; line-height: 1.7; border-radius: 7px; margin-top: 45px; margin-bottom: 45px;height: 100%; flex: 1; min-height: 50vh">
        <form style="margin-bottom: 15px;">
            <label style="margin: 5px; margin-bottom: 20px;"><h3>Nordic Countries</h3></label><br>
            <select id="nordic_countries" class="form-control">
                <option value="The Land of a Thousand Lakes">Finland</option>
                <option value="Det avlånga landet, the elongated country">Sweden</option>
                <option value="Danevang or Dannevang">Denmark</option>
                <option value="The Land of the Midnight Sun">Norway</option>
                <option value="The Land of Fire and Ice">Iceland</option>
                <option value="Kalaallit Nunaat">Greenland</option>
                <option value="Sheep Islands">Faroe Islands</option>
            </select>
            <!-- I put the country nicknames as the values so that they could be read and shown easily through pyscript -->
        </form>

        <button class="btn mt-3" type="submit" style="background-color: #FECC02; color: #006AA7; width: 60%; margin: auto;" py-click="get_nickname"><b>Get nickname</b></button>

        <div id="display_box">
            <div id="display_nickname" style="margin-top: 30px; font-weight: bold; font-size: 15px;"></div> <!--The countries nickname appears here-->
        </div>
        </main>

    <footer style="text-align: center; margin-top: 80px; background-color: #02529C; color: #FFFFFF; padding: 20px;">
        <b>Nickname Atlas; Nordic Countries</b><br>
        <p>ICT | 10S | Q2SW1</p>
    </footer>

    <py-script src="main.py"></py-script>
</body>
</html>
